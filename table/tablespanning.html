<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table spanning</title>
</head>
<body>
    <table border="4px">
        <thead>
            <tr>
                <th>ID</th>
                <th colspan="2">Name</th>
                <th>Batch</th>
            </tr>
        </thead>
        <tbody>
        <tr><td>12</td>
        <td>Eldho</td>
        <td>Raj</td>
        <td>Dec</td></tr></tbody>
    </table><br>
    <br><br>


    <table border="2px">
        <thead><th>Days </th>
            <td>7</td>

        </thead>
        <tbody>
        <tr><tr><th rowspan="8">Weeks</th></tr><td>Monday</td>
        <tr><td>Tuesday
        </td></tr>
        <tr><td>Wednesday</td></tr>
        <tr><td>Thursday</td></tr>
        <tr><td>Friday</td></tr>
        <tr><td>Saturday</td></tr>
        <tr><td>Sunday</td></tr>
    </tbody>
        
    
</body>
</html>
